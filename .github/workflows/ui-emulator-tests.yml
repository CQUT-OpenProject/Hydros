name: UI emulator tests

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
      artifact_suffix:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  run:
    name: Offline UI tests (API 35)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Checkout workflow diagnostics
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Manual release retries may update CI while keeping the tagged app source fixed.
          ref: ${{ github.workflow_sha }}
          path: ci-tools
          sparse-checkout: scripts/run-android-tests.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Setup Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: true
      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          if [[ -e /dev/kvm ]]; then
            sudo chmod a+rw /dev/kvm
          fi
          if ! test -r /dev/kvm || ! test -w /dev/kvm; then
            echo '::error::KVM is unavailable on this hosted runner (nested virtualization not exposed).'
            ls -la /dev/kvm 2>&1 || true
            exit 1
          fi
      - name: Compile UI tests before starting emulator
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Run offline instrumentation suite
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-linux-hw-accel: false
          disable-animations: false
          pre-emulator-launch-script: '"$ANDROID_HOME/emulator/emulator" -accel-check'
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -accel on -gpu swiftshader_indirect -camera-back emulated
          script: bash ci-tools/scripts/run-android-tests.sh
      - name: Upload UI reports and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-reports-${{ github.run_attempt }}${{ inputs.artifact_suffix }}
          path: |
            app/build/reports/androidTests
            app/build/reports/instrumentation
            app/build/outputs/androidTest-results
          retention-days: 7
          if-no-files-found: ignore
