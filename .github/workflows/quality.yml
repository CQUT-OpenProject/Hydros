name: Quality

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      run_ui_tests:
        description: Run emulator UI tests
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
      run_ui_tests:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ inputs.ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !inputs.run_ui_tests }}

jobs:
  checks:
    name: Lint, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Setup Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Verify release tooling and Firebase configuration
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          python3 scripts/release.py version
          python3 scripts/release.py firebase app/google-services.json
      - name: Run Lint, unit tests and compile application and UI tests
        run: ./gradlew --no-daemon :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-reports-${{ github.run_attempt }}
          path: |
            app/build/reports/lint-results-*
            app/build/reports/tests
            app/build/test-results
          retention-days: 7
          if-no-files-found: ignore

  ui:
    name: Offline UI tests (API 35)
    if: inputs.run_ui_tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Checkout workflow diagnostics
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Manual release retries may update CI while keeping the tagged app source fixed.
          ref: ${{ github.workflow_sha }}
          path: ci-tools
          sparse-checkout: scripts/run-android-tests.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Setup Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: true
      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Compile UI tests before starting emulator
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Run offline instrumentation suite
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-linux-hw-accel: false
          disable-animations: false
          pre-emulator-launch-script: '"$ANDROID_HOME/emulator/emulator" -accel-check'
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -accel on -gpu swiftshader_indirect -camera-back emulated
          script: bash ci-tools/scripts/run-android-tests.sh
      - name: Upload UI reports and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-reports-${{ github.run_attempt }}
          path: |
            app/build/reports/androidTests
            app/build/reports/instrumentation
            app/build/outputs/androidTest-results
          retention-days: 7
          if-no-files-found: ignore

  complete:
    name: CI complete
    if: always()
    needs: [checks, ui]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required checks passed
        env:
          CHECKS: ${{ needs.checks.result }}
          UI: ${{ needs.ui.result }}
          REQUIRE_UI: ${{ inputs.run_ui_tests }}
        run: |
          [[ "$CHECKS" == success ]]
          if [[ "$REQUIRE_UI" == true ]]; then
            [[ "$UI" == success ]]
          else
            [[ "$UI" == skipped || "$UI" == success ]]
          fi
