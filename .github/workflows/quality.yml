name: Quality

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      run_ui_tests:
        description: Run emulator UI tests
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
      run_ui_tests:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ inputs.ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !inputs.run_ui_tests }}

jobs:
  checks:
    name: Lint, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Setup Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Verify release tooling and Firebase configuration
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          python3 scripts/release.py version
          python3 scripts/release.py firebase app/google-services.json
      - name: Run Lint, unit tests and compile application and UI tests
        run: ./gradlew --no-daemon :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-reports-${{ github.run_attempt }}
          path: |
            app/build/reports/lint-results-*
            app/build/reports/tests
            app/build/test-results
          retention-days: 7
          if-no-files-found: ignore

  ui:
    name: Offline UI tests (API 35)
    if: inputs.run_ui_tests
    uses: ./.github/workflows/ui-emulator-tests.yml
    with:
      ref: ${{ inputs.ref || github.sha }}

  ui-retry:
    name: Offline UI tests (API 35, runner retry)
    needs: ui
    if: ${{ always() && inputs.run_ui_tests && needs.ui.result == 'failure' }}
    uses: ./.github/workflows/ui-emulator-tests.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
      artifact_suffix: -retry

  complete:
    name: CI complete
    if: always()
    needs: [checks, ui, ui-retry]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required checks passed
        env:
          CHECKS: ${{ needs.checks.result }}
          UI: ${{ needs.ui.result }}
          UI_RETRY: ${{ needs.ui-retry.result }}
          REQUIRE_UI: ${{ inputs.run_ui_tests }}
        run: |
          [[ "$CHECKS" == success ]]
          if [[ "$REQUIRE_UI" == true ]]; then
            [[ "$UI" == success || "$UI_RETRY" == success ]]
          else
            [[ "$UI" == skipped || "$UI" == success ]]
            [[ "$UI_RETRY" == skipped || "$UI_RETRY" == success ]]
          fi
